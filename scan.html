<!-- ✅ مكتبات صحيحة -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
<script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>

<script>
(function() {
    'use strict';

    // ═══════════════════════════════════════════════════════════
    // Helpers (معرّفة أولاً)
    // ═══════════════════════════════════════════════════════════
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const autoMode = document.getElementById('autoMode');
    const manualMode = document.getElementById('manualMode');
    const connectionStatus = document.getElementById('connectionStatus');
    const lastScan = document.getElementById('lastScan');
    const lastScanCode = document.getElementById('lastScanCode');
    const scanCountEl = document.getElementById('scanCount');

    function showError(message) {
        if (errorText) errorText.textContent = message;
        if (errorBox) errorBox.style.display = 'flex';
        if (loadingOverlay) loadingOverlay.classList.add('hidden');

        // ✅ أخفِ شاشة التحميل الأولية أيضاً
        const loader = document.getElementById('initial-loader');
        if (loader) {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 500);
        }
    }

    function updateConnectionStatus(status, text) {
        if (!connectionStatus) return;
        connectionStatus.className = 'status ' + status;
        const textEl = connectionStatus.querySelector('.status-text');
        if (textEl) textEl.textContent = text;
    }

    function flashScreen() {
        const flash = document.createElement('div');
        flash.className = 'flash';
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 400);
    }

    let audioContext = null;
    function playBeep() {
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = 1400;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.15, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.12);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.12);
        } catch (e) {}
    }

    // ═══════════════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════════════
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'auto';
    const peerId = urlParams.get('peer');

    console.log('📱 Scan page, mode:', mode, 'peer:', peerId);

    const state = {
        mode: mode,
        peer: null,
        connection: null,
        simplePeer: null,
        isConnected: false,
        html5QrCode: null,
        offerScanner: null,
        scanCount: 0,
        lastSentCode: '',
        lastSentTime: 0,
    };

    function sendBarcode(code) {
        const now = Date.now();
        if (code === state.lastSentCode && (now - state.lastSentTime) < 2000) return false;

        let sent = false;

        if (state.connection && state.connection.open) {
            try {
                state.connection.send({ type: 'barcode', code, timestamp: now });
                sent = true;
            } catch (e) {
                console.error('PeerJS send error:', e);
            }
        }

        if (!sent && state.simplePeer && state.simplePeer.connected) {
            try {
                state.simplePeer.send(JSON.stringify({ type: 'barcode', code, timestamp: now }));
                sent = true;
            } catch (e) {
                console.error('SimplePeer send error:', e);
            }
        }

        if (sent) {
            state.lastSentCode = code;
            state.lastSentTime = now;
            state.scanCount++;
            if (scanCountEl) scanCountEl.textContent = state.scanCount;
            if (lastScanCode) lastScanCode.textContent = code;
            if (lastScan) lastScan.style.display = 'block';
            setTimeout(() => { if (lastScan) lastScan.style.display = 'none'; }, 1500);
            flashScreen();
            playBeep();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        return sent;
    }

    // ═══════════════════════════════════════════════════════════
    // AUTO MODE
    // ═══════════════════════════════════════════════════════════
    async function startAutoMode() {
        autoMode.style.display = 'flex';

        if (!peerId) {
            showError('الرابط لا يحتوي على معرّف الاتصال.');
            return;
        }

        loadingText.textContent = 'جاري الاتصال بالكمبيوتر...';

        state.peer = new Peer({ debug: 1 });

        state.peer.on('open', (id) => {
            console.log('📱 Phone ready, ID:', id);

            const conn = state.peer.connect(peerId, {
                reliable: true,
                serialization: 'json',
            });

            state.connection = conn;

            conn.on('open', () => {
                console.log('✅ Connected to computer');
                state.isConnected = true;
                updateConnectionStatus('connected', 'متصل');
                conn.send({ type: 'hello', device: navigator.userAgent });
                startCamera();
            });

            conn.on('data', (data) => {
                if (data.type === 'ack') {
                    // Confirmed
                }
            });

            conn.on('close', () => {
                state.isConnected = false;
                updateConnectionStatus('disconnected', 'انقطع');
                showError('انقطع الاتصال بالكمبيوتر.');
            });

            conn.on('error', (err) => {
                console.error('Connection error:', err);
                state.isConnected = false;
                updateConnectionStatus('disconnected', 'خطأ');
            });
        });

        state.peer.on('error', (err) => {
            console.error('Peer error:', err);
            let msg = 'فشل الاتصال بالكمبيوتر.';
            if (err.type === 'peer-unavailable') msg = 'الكمبيوتر غير متاح. تأكد من فتح نافذة المسح.';
            else if (err.type === 'network') msg = 'مشكلة في الشبكة.';
            showError(msg);
        });
    }

    // ═══════════════════════════════════════════════════════════
    // MANUAL MODE
    // ═══════════════════════════════════════════════════════════
    async function startManualMode() {
        manualMode.classList.add('active');
        loadingOverlay.classList.add('hidden');
        await startOfferScanner();
    }

    async function startOfferScanner() {
        state.offerScanner = new Html5Qrcode('offerScanner', {
            formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
            verbose: false,
        });

        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0,
        };

        try {
            await state.offerScanner.start(
                { facingMode: 'environment' },
                config,
                onOfferScanned,
                () => {}
            );
        } catch (err) {
            console.error('Camera error:', err);
            showError('تعذر فتح الكاميرا. اسمح بالوصول للكاميرا.');
        }
    }

    async function onOfferScanned(decodedText) {
        try {
            await state.offerScanner.stop();
            state.offerScanner = null;
        } catch (e) {}

        await handleManualOffer(decodedText);
    }

    async function handleManualOffer(offerData) {
        try {
            const decoded = JSON.parse(atob(offerData));
            console.log('📥 Received offer');

            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('step2').classList.add('active');

            state.simplePeer = new SimplePeer({
                initiator: false,
                trickle: false,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                    ],
                },
            });

            state.simplePeer.on('signal', (data) => {
                if (data.type === 'answer') {
                    const answerEncoded = btoa(JSON.stringify(data));

                    // ✅ تحقق من وجود QRCode
                    if (typeof QRCode === 'undefined') {
                        console.error('❌ QRCode library not loaded!');
                        showError('مكتبة QR غير محمّلة');
                        return;
                    }

                    QRCode.toDataURL(answerEncoded, {
                        width: 500,
                        margin: 1,
                        errorCorrectionLevel: 'L',
                        color: {
                            dark: '#0f172a',
                            light: '#ffffff',
                        },
                    }, (err, url) => {
                        if (err) {
                            console.error('QR generation error:', err);
                            return;
                        }
                        document.getElementById('answerQRImage').src = url;
                    });
                }
            });

            state.simplePeer.on('connect', () => {
                console.log('✅ Manual WebRTC connected');
                state.isConnected = true;

                document.getElementById('step2').style.display = 'none';
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').style.display = 'block';
                document.getElementById('step3').classList.add('active');

                setTimeout(() => {
                    activateCamera().catch(err => {
                        console.error('Camera activation error:', err);
                    });
                }, 500);
            });

            state.simplePeer.on('data', (data) => {
                try {
                    const msg = JSON.parse(data.toString());
                    if (msg.type === 'ack') {}
                } catch (e) {}
            });

            state.simplePeer.on('error', (err) => {
                console.error('SimplePeer error:', err);
                showError('خطأ في الاتصال: ' + err.message);
            });

            state.simplePeer.signal(decoded);

        } catch (e) {
            console.error('Manual offer error:', e);
            showError('تعذر قراءة رمز QR. جرّب مرة أخرى.');
        }
    }

    // ═══════════════════════════════════════════════════════════
    // Camera
    // ═══════════════════════════════════════════════════════════
    async function activateCamera() {
        if (state.html5QrCode) return;

        state.html5QrCode = new Html5Qrcode('reader', {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.CODE_93,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.CODABAR,
            ],
            verbose: false,
        });

        const config = {
            fps: 15,
            qrbox: (w, h) => {
                const minEdge = Math.min(w, h);
                const size = Math.floor(minEdge * 0.75);
                return { width: size, height: Math.floor(size * 0.6) };
            },
            aspectRatio: 1.777,
        };

        await state.html5QrCode.start(
            { facingMode: 'environment' },
            config,
            onScanSuccess,
            () => {}
        );
    }

    async function startCamera() {
        loadingText.textContent = 'جاري تشغيل الكاميرا...';
        try {
            await activateCamera();
            loadingOverlay.classList.add('hidden');
        } catch (err) {
            console.error('Camera error:', err);
            showError('تعذر فتح الكاميرا. اسمح بالوصول للكاميرا.');
        }
    }

    function onScanSuccess(decodedText) {
        sendBarcode(decodedText);
    }

    // ═══════════════════════════════════════════════════════════
    // Cleanup
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('beforeunload', () => {
        try { if (state.html5QrCode) state.html5QrCode.stop(); } catch (e) {}
        try { if (state.offerScanner) state.offerScanner.stop(); } catch (e) {}
        try { if (state.connection) state.connection.close(); } catch (e) {}
        try { if (state.peer) state.peer.destroy(); } catch (e) {}
        try { if (state.simplePeer) state.simplePeer.destroy(); } catch (e) {}
    });

    // ═══════════════════════════════════════════════════════════
    // Entry Point
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('load', () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 500);
        }

        console.log('🚀 Scan page, mode:', mode);

        // ✅ تحقق مبكر من peerId
        if (!peerId && mode === 'auto') {
            showError('معرّف الاتصال غير موجود في الرابط');
            return;   // ✅ return داخل دالة load — مسموح
        }

        if (mode === 'manual') {
            startManualMode();
        } else {
            startAutoMode();
        }
    });

})();  // ✅ إغلاق IIFE
</script>
